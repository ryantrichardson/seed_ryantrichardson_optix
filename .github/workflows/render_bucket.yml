name: Render Bucket Wicks
on:
  workflow_dispatch:
    inputs:
      ticker:   { default: 'QQQ' }
      pct_lo:   { default: '5' }
      pct_hi:   { default: '100' }
      n:        { default: '10' }
      tag:      { default: 'b' }
      touched:  { default: 'any' }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests matplotlib pandas
      - env:
          MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"
          TICKER: "${{ inputs.ticker }}"
          PCT_LO: "${{ inputs.pct_lo }}"
          PCT_HI: "${{ inputs.pct_hi }}"
          N:      "${{ inputs.n }}"
          TAG:    "${{ inputs.tag }}"
          TOUCHED: "${{ inputs.touched }}"
        run: python scripts/render_bucket_wicks.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bucket-charts
          path: data/charts/${{ inputs.tag }}_*.png
          retention-days: 30
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && \
            git add data/charts/${{ inputs.tag }}_*.png && \
            (git diff --staged --quiet || git commit -m "Bucket wick charts: ${{ inputs.ticker }} ${{ inputs.pct_lo }}-${{ inputs.pct_hi }}") && \
            git push && break
            sleep 5
          done
