name: options_reprobe
on: workflow_dispatch
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install boto3 requests
      - env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
        run: python scripts/probe_options_contracts.py 2>&1 | tee pull_output.txt
      - name: tar options data
        if: always()
        run: |
          cd /tmp && tar czf options_data.tar.gz options_data/ 2>/dev/null || echo "no data"
          ls -lh /tmp/options_data.tar.gz || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: options_data
          path: |
            /tmp/options_data.tar.gz
            pull_output.txt
