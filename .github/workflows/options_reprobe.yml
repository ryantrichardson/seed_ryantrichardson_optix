name: options_reprobe
on: workflow_dispatch
jobs:
  slim:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install boto3
      - env:
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
          SHARD: ${{ matrix.shard }}
        run: python scripts/slim_trades_qqq_spy.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: slim_shard_${{ matrix.shard }}
          path: /tmp/slim_trades_qqq_spy_shard${{ matrix.shard }}.csv.gz
