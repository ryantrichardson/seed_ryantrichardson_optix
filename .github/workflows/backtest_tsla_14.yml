name: backtest_tsla_14
on:
  workflow_dispatch:

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run backtest
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/backtest_tsla_14_wicks.py
      - uses: actions/upload-artifact@v4
        with:
          name: tsla_14_wicks_results
          path: |
            data/tsla_14_wicks_results.csv
