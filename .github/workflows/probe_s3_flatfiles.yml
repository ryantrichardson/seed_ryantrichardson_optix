name: probe_s3_flatfiles
on: workflow_dispatch
jobs:
  spy_extend:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      matrix:
        shard: [1, 2, 3, 4]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install boto3
      - env:
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
          SHARD: ${{ matrix.shard }}
        run: python -u scripts/slim_trades_spy_extend.py 2>&1 | tee /tmp/output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spy_ext_shard${{ matrix.shard }}
          path: |
            /tmp/slim_trades_spy_ext_shard*.csv.gz
            /tmp/output.txt
