name: pbar_scan_spy_jan2026
on:
  workflow_dispatch:
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/pbar_scan_spy_jan2026.py | tee pbar_scan_output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbar_scan_spy_jan2026
          path: |
            pbar_scan_output.txt
            data/pbar_spy_jan2026.csv
