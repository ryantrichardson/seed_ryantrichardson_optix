name: wick_order_thesis
on:
  workflow_dispatch:
jobs:
  thesis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/wick_order_thesis.py
      - uses: actions/upload-artifact@v4
        with:
          name: wick_order_thesis
          path: |
            data/wick_test1_delayed.csv
            data/wick_test2_workoff.csv
