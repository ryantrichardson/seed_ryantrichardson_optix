name: enrich_regime
on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run regime enrichment
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/enrich_regime.py
      - uses: actions/upload-artifact@v4
        with:
          name: all_wicks_regime
          path: |
            data/all_wicks_regime.csv
            data/all_wicks_regime.json
