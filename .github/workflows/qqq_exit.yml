name: QQQ Exit Optimization
on: { workflow_dispatch: {} }
permissions: { contents: write }
jobs:
  c:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: { token: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install requests pandas numpy
      - env: { MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}" }
        run: python scripts/qqq_exit_optimizer.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qqq-exit-analysis
          path: data/analysis/qqq_exit/
          retention-days: 60
      - run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && \
            git add data/analysis/qqq_exit/ && \
            (git diff --staged --quiet || git commit -m "QQQ exit optimization results") && \
            git push && break
            sleep 5
          done
