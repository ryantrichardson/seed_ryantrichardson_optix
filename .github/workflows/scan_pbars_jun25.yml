name: scan_pbars_jun25
on: workflow_dispatch
jobs:
  scan_pbars:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      matrix:
        ticker: [SPY, QQQ]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Download all shards for ${{ matrix.ticker }}
        uses: actions/download-artifact@v4
        with:
          path: /tmp/artifacts
          pattern: ${{ matrix.ticker == 'SPY' && 'spy_jun25_shard*' || 'qqq_jun25_shard*' }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ matrix.ticker == 'SPY' && '26724820712' || '26724821254' }}
      - run: ls -la /tmp/artifacts/ && find /tmp/artifacts -name "*.csv.gz" | head
      - env:
          TICKER: ${{ matrix.ticker }}
        run: python -u scripts/pbar_scanner_jun25.py
      - name: Commit results
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "actions@users.noreply.github.com"
          git add data/pbar_results/pbar_${{ matrix.ticker == 'SPY' && 'spy' || 'qqq' }}_jun25_may26.csv
          git commit -m "PBAR scan ${{ matrix.ticker }} Jun 2025 - May 2026" || echo "nothing to commit"
          git pull --rebase || true
          git push || true
