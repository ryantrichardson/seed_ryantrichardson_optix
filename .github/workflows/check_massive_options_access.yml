name: check_massive_options_access
on: {workflow_dispatch: {}}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/check_massive_options_access.py | tee output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: check_massive_options_access, path: output.txt}
