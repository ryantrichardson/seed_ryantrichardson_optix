name: slim_trades_amzn_today
on: { workflow_dispatch: {} }
permissions: { contents: read }
jobs:
  pull:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install boto3
      - run: python scripts/slim_trades_amzn_today.py
        env:
          MASSIVE_S3_ACCESS_KEY_ID: ${{ secrets.MASSIVE_S3_ACCESS_KEY_ID }}
          MASSIVE_S3_SECRET_KEY: ${{ secrets.MASSIVE_S3_SECRET_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: amzn_jun02_trades
          path: /tmp/slim_trades_amzn_jun02.csv.gz
          retention-days: 7
          if-no-files-found: warn
