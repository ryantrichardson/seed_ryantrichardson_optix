name: inspect_spy_0115_0800
on:
  workflow_dispatch:
jobs:
  insp:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/inspect_spy_0115_0800.py | tee out.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: inspect_spy_0115_0800, path: out.txt}
