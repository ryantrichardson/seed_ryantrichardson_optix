name: Update SVR Data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 23 * * 1-5"   # weekdays 23:00 UTC = 7pm ET

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/update_svr.py
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add data
          git commit -m "Update SVR data" || echo "no changes"
          git push
