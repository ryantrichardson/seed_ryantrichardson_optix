name: compare_ghost_vs_pbar
on: {workflow_dispatch: {}}
jobs:
  cmp:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/compare_ghost_vs_pbar.py | tee output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: compare_ghost_vs_pbar, path: output.txt}
