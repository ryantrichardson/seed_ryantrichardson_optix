name: pbar_scan_spy_oct_nov2025
on: {workflow_dispatch: {}}
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install requests
      - env: {MASSIVE_API_KEY: "${{ secrets.MASSIVE_API_KEY }}"}
        run: python scripts/pbar_scan_spy_oct_nov2025.py | tee output.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pbar_scan_spy_oct_nov2025
          path: |
            output.txt
            data/pbar_spy_oct_nov2025.csv
