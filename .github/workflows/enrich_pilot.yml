name: enrich_pilot
on:
  workflow_dispatch:

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run enrichment
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/enrich_pilot.py
      - uses: actions/upload-artifact@v4
        with:
          name: pilot_enriched
          path: |
            data/pilot_enriched.csv
            data/pilot_enriched.json
