name: wick_print_dist
on:
  workflow_dispatch:

jobs:
  dist:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Run distribution analysis
        env:
          MASSIVE_API_KEY: ${{ secrets.MASSIVE_API_KEY }}
        run: python scripts/wick_print_distribution.py
      - uses: actions/upload-artifact@v4
        with:
          name: wick_print_distribution
          path: data/wick_print_distribution.json
